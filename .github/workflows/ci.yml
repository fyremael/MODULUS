name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check modulus scripts

      - name: API docs freshness
        id: api-docs
        run: |
          if ! python scripts/generate_api_docs.py --check; then
            python scripts/generate_api_docs.py
            exit 1
          fi

      - name: Upload expected API docs on freshness failure
        if: failure() && steps.api-docs.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expected-api-docs-py${{ matrix.python-version }}-${{ github.sha }}
          path: docs/api_generated
          if-no-files-found: error

      - name: Test
        run: python -m pytest

  benchmark-report:
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + report deps
        run: python -m pip install -e ".[dev,report]"

      - name: Run quick benchmark
        run: |
          rm -rf artifacts/benchmarks/ci_run
          python scripts/run_benchmarks.py --steps 20 --warmup-steps 3 --batch-size 32 --width 64 --out-dir artifacts/benchmarks/ci_run

      - name: Build benchmark report
        run: python scripts/build_benchmark_report.py --run-dir artifacts/benchmarks/ci_run --with-plots

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-report-${{ github.sha }}
          path: artifacts/benchmarks/ci_run
          if-no-files-found: error
